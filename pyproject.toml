[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarpipeworker"
version = "0.1.0"
description = "Sandboxed LWA quick processing worker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "astropy",
  "h5py",
  "matplotlib",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["solarpipeworker*"]

[tool.setuptools.package-data]
solarpipeworker = ["lua/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
